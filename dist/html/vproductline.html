    <!-- ===== 主要 3D 與 控制區 ===== -->
    <main class="content-wrapper">
        
        <!-- 左側：3D 視圖與狀態 -->
        <div class="left-panel">
            <div class="status-badge uph-badge">目前每小時產量 : <span id="current-uph">80</span></div>
            
            <div class="dt-status-box">
                <div class="dt-status-title">模擬動作監控</div>
                <div id="dt-state-text" class="dt-status-value">尚未啟動</div>
                <div id="dt-state-time" class="dt-status-time">-- / --</div>
            </div>

            <!-- 3D 渲染區域 -->
            <div id="canvas-container"></div>

            <!-- 底部浮動儲存條 -->
            <div class="floating-confirm-bar" id="save-bar">
                <div class="confirm-text">數值已變更&nbsp;&nbsp;&nbsp;每小時產量更動為 ➔ <span id="new-uph" style="color: #00ff88; font-size: 18px;">--</span></div>
                <button class="confirm-btn" id="save-btn">確認儲存</button>
            </div>
        </div>

        <!-- 右側：參數控制面板 -->
        <div class="right-panel">
            <!-- ⚡ 修改：雙軌離線模擬按鈕 -->
            <div class="system-controls">
                <button class="sys-btn btn-metal" id="btn-sim-metal">▶ 模擬金屬產線</button>
                <button class="sys-btn btn-nonmetal" id="btn-sim-nonmetal">▶ 模擬非金屬產線</button>
            </div>
            <!-- 參數清單由 JS 動態生成 -->
            <div id="parameters-container"></div>
        </div>

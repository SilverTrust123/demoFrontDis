<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 輪詢紀錄器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
      background: #f5f5f7;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    label { font-weight: bold; width: 80px; }
    input[type="text"], input[type="number"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="text"] { flex: 1; min-width: 250px; }
    input[type="number"] { width: 100px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-start { background: #28a745; color: white; }
    .btn-start:hover { background: #218838; }
    .btn-stop { background: #dc3545; color: white; }
    .btn-stop:hover { background: #c82333; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    
    .status-bar {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #555;
    }
    .status-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .running { background: #d4edda; color: #155724; }
    .stopped { background: #e2e3e5; color: #383d41; }
    
    .log-container {
      background: #1e1e1e;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      padding: 15px;
      border-radius: 8px;
      height: 400px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .log-entry { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .log-time { color: #888; }
    .log-status-200 { color: #00ff66; }
    .log-status-error { color: #ff4d4d; }
  </style>
</head>
<body>

  <h2>API 輪詢與日誌記錄器</h2>

  <div class="card">
    <div class="form-group">
      <label for="apiUrl">目標 URL:</label>
      <input type="text" id="apiUrl" placeholder="http://192.168.3.85:9090/plc/state" value="http://192.168.3.85:9090/plc/state">
    </div>
    <div class="form-group">
      <label for="interval">輪詢間隔:</label>
      <input type="number" id="interval" value="3" min="0.5" step="0.5"> 秒
    </div>
    
    <div class="btn-group">
      <button id="startBtn" class="btn-start" onclick="startPolling()">開始輪詢</button>
      <button id="stopBtn" class="btn-stop" onclick="stopPolling()" disabled>停止輪詢</button>
      <button class="btn-secondary" onclick="clearLogs()">清除紀錄</button>
      <button class="btn-secondary" onclick="exportJSON()">匯出 JSON</button>
    </div>
  </div>

  <div class="card">
    <div class="status-bar">
      <div>狀態: <span id="statusBadge" class="status-badge stopped">已停止</span></div>
      <div>發送次數: <span id="count">0</span></div>
      <div>成功: <span id="successCount">0</span> | 失敗: <span id="errorCount">0</span></div>
    </div>
  </div>

  <div class="card">
    <div class="log-container" id="logBox">
      <div class="log-entry log-time">// 系統準備就緒，點擊「開始輪詢」進行測試...</div>
    </div>
  </div>

  <script>
    let isPolling = false;
    let timerId = null;
    let logs = [];
    let totalCount = 0;
    let successCount = 0;
    let errorCount = 0;

    async function poll() {
      if (!isPolling) return;

      const url = document.getElementById('apiUrl').value.trim();
      const intervalSec = parseFloat(document.getElementById('interval').value) || 3;
      
      if (!url) {
        alert("請輸入有效的 URL");
        stopPolling();
        return;
      }

      totalCount++;
      const startTime = performance.now();
      const timestamp = new Date().toISOString();
      let logRecord = { id: totalCount, timestamp, url };

      try {
        const response = await fetch(url, { cache: 'no-store' });
        const latency = Math.round(performance.now() - startTime);
        let data;
        
        const contentType = response.headers.get("content-type");
        if (contentType && contentType.includes("application/json")) {
          data = await response.json();
        } else {
          data = await response.text();
        }

        logRecord.status = response.status;
        logRecord.latencyMs = latency;
        logRecord.data = data;

        if (response.ok) {
          successCount++;
          appendLogUI(timestamp, response.status, latency, data, true);
        } else {
          errorCount++;
          appendLogUI(timestamp, response.status, latency, data, false);
        }
      } catch (err) {
        const latency = Math.round(performance.now() - startTime);
        errorCount++;
        logRecord.status = "NET_ERROR";
        logRecord.error = err.message;
        appendLogUI(timestamp, "網路錯誤/CORS問題", latency, err.message, false);
      }

      logs.push(logRecord);
      updateStats();

      // 如果仍在輪詢狀態，預約下一次發送
      if (isPolling) {
        timerId = setTimeout(poll, intervalSec * 1000);
      }
    }

    function startPolling() {
      if (isPolling) return;
      isPolling = true;
      
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('apiUrl').disabled = true;
      document.getElementById('interval').disabled = true;
      
      const badge = document.getElementById('statusBadge');
      badge.textContent = "輪詢中...";
      badge.className = "status-badge running";

      poll(); // 立即發送第一次請求
    }

    function stopPolling() {
      isPolling = false;
      if (timerId) clearTimeout(timerId);

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('apiUrl').disabled = false;
      document.getElementById('interval').disabled = false;

      const badge = document.getElementById('statusBadge');
      badge.textContent = "已停止";
      badge.className = "status-badge stopped";
    }

    function appendLogUI(time, status, latency, content, isSuccess) {
      const logBox = document.getElementById('logBox');
      const entry = document.createElement('div');
      entry.className = 'log-entry';

      const statusClass = isSuccess ? 'log-status-200' : 'log-status-error';
      const formattedContent = typeof content === 'object' ? JSON.stringify(content) : content;

      entry.innerHTML = `
        <span class="log-time">[${time.split('T')[1].slice(0, 8)}]</span> 
        <span class="${statusClass}">HTTP ${status}</span> 
        <span style="color:#aaa">(${latency}ms)</span> - 
        <span>${escapeHtml(formattedContent)}</span>
      `;

      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight; // 自動捲動到底部
    }

    function updateStats() {
      document.getElementById('count').textContent = totalCount;
      document.getElementById('successCount').textContent = successCount;
      document.getElementById('errorCount').textContent = errorCount;
    }

    function clearLogs() {
      logs = [];
      totalCount = 0;
      successCount = 0;
      errorCount = 0;
      updateStats();
      document.getElementById('logBox').innerHTML = '<div class="log-entry log-time">// 記錄已清除</div>';
    }

    function exportJSON() {
      if (logs.length === 0) {
        alert("目前沒有任何紀錄可匯出");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `polling_logs_${new Date().getTime()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>

            <div class="formula-box">
                <div class="formula-header-row">
                    <span class="formula-title">預測今日總產出 (8hr)：</span>
                </div>
                
                <div class="formula-calc-row">
                    <span class="formula-text">
                        [ (3600 / 金屬循環 <span id="metal-ct" class="highlight-sec">0</span>s) + (3600 / 非金屬循環 <span id="nonmetal-ct" class="highlight-sec">0</span>s) ] &times; 8 hr
                    </span>
                    <span class="formula-equal">=</span>
                    <span class="formula-result"><span id="predict-total" class="highlight-total">0</span> 個</span>
                </div>
            </div>

            <div class="chart-header">
                <span class="blue-dot">●</span>

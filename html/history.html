    <main class="content-area">
        <div class="history-header-row">
            <div class="chart-tabs">
                <!-- 預設在第一個按鈕加上 active 與 active-temp -->
                <button class="tab-btn active active-temp" data-target="temp">Temperature 1 (°C)</button>
                <button class="tab-btn" data-target="humi">Humidity 1 (%)</button>
                <button class="tab-btn" data-target="temp2">Temperature 2 (°C)</button>
                <button class="tab-btn" data-target="humi2">Humidity 2 (%)</button>
                <button class="tab-btn" data-target="co2">CO2 (ppm)</button>
                <button class="tab-btn" data-target="pm">pollution (μg/m³)</button>
                <button class="tab-btn" data-target="power">Electric current (kW)</button>
            </div>
        </div>
        
        <div class="single-chart-container">
            <div class="chart-card-single" id="main-card">
                <h3 class="card-label" id="current-chart-label">Temperature 1</h3>
                <div class="chart-wrapper">
                    <canvas id="historyChart"></canvas>
                </div>
                <!-- 新增：右下角清除歷史資料按鈕 -->
                <div class="card-footer-action">
                    <button id="clear-history-btn" class="clear-data-btn">
                        <span class="trash-icon">🗑</span>清除歷史資料
                    </button>
                </div>
            </div>

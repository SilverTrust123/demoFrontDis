        <div class="header-divider"></div>

    <main class="content-wrapper">
        <div class="sensor-controls">
            <div class="label-box">感測器</div>
            <div class="select-container">
                <select id="sensor-select" class="styled-select">
                    <option value="" disabled selected>------請選擇------</option>
                    <option value="8266_2">溫溼度感測器 1</option>
                    <option value="8266_4">溫溼度感測器 2</option>
                    <option value="8266_5">電流感測器</option>
                    <option value="8266_3">CO2 感測器</option>
                    <option value="8266_6">PM2.5 感測器</option>
                </select>  
            </div>

            <div class="date-btn-group">
                <button type="button" class="time-btn" id="btn-today">本日</button>
                <button type="button" class="time-btn" id="btn-week">本周</button>
                <button type="button" class="time-btn" id="btn-month">本月</button>
                
                <div class="custom-date-wrapper">
                    <button type="button" class="time-btn" id="btn-custom">自訂</button>
                    <div class="hidden-pickers">
                        <input type="date" id="custom-start-picker">
                        <input type="date" id="custom-end-picker">
                    </div>
                </div>
            </div>

            <div id="date-display-group" class="date-inputs hidden">
                <input type="text" id="display-date-start" class="date-picker-ui" readonly>
                <span class="date-separator">~</span>
                <input type="text" id="display-date-end" class="date-picker-ui" readonly>
            </div>
        </div>

        <!-- 歷史數據文字表格容器 -->
        <div class="data-table-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>時間戳記</th>
                        <th>設備 ID</th>
                        <th>溫度 (°C)</th>
                        <th>濕度 (%)</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #888;">請選擇感測器與時間區間以載入資料</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

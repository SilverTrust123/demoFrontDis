<main class="content-wrapper">
    <div class="filter-controls">
        <button type="button" class="log-btn active" id="btn-all">All</button>
        <button type="button" class="log-btn" id="btn-warn">Warn</button>
        <button type="button" class="log-btn" id="btn-error">Error</button>
        <button type="button" class="log-btn locked" id="btn-info">Information</button>

        <div class="time-picker-group">
            <span class="time-label">查詢區間：</span>
            <input type="datetime-local" id="filter-start" class="time-input">
            <span class="time-separator">至</span>
            <input type="datetime-local" id="filter-end" class="time-input">
            <button type="button" class="search-submit-btn" id="btn-search-time">
                執行查詢
            </button>
        </div>

        <!-- ✨ 新增：置右的清理 Log 按鈕 -->
        <button type="button" class="clear-log-btn" id="btn-clear-log">
            🗑️ 清理Log
        </button>
    </div>

    <div class="log-display-area">
        <div class="log-label">系統日誌內容：</div>
        <ul id="log-list" class="log-list-style">
            <li>正在載入日誌資料...</li>

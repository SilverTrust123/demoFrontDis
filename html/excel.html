    <!-- ===== Main Content ===== -->
    <main class="content-wrapper">
        <div class="report-left-section">
            <!-- 全部時間段 Excel -->
            <div class="report-controls">
                <div class="report-label-box">全部時間段excel</div>
                <div class="report-select-container">
                    <select class="styled-select" id="excel-all-select">
                        <option value="" disabled selected>------請選擇------</option>
                        <option value="temperatureAndHumidity">temperatureAndHumidity</option>
                        <option value="circuit">circuit</option>
                        <option value="airQuality">airQuality</option>
                        <option value="airParticulates">airParticulates</option>
                    </select>
                </div>
                <button class="styled-download-btn" id="btn-excel-all">下載</button>
            </div>

            <!-- 部分時間段 Excel -->
            <div class="report-controls">
                <div class="report-label-box">部分時間段excel</div>
                <div class="report-select-container">
                    <select class="styled-select" id="excel-part-select">
                        <option value="" disabled selected>------請選擇------</option>
                        <option value="temperatureAndHumidity">temperatureAndHumidity</option>
                        <option value="circuit">circuit</option>
                        <option value="airQuality">airQuality</option>
                        <option value="airParticulates">airParticulates</option>
                    </select>
                </div>
                <button class="styled-download-btn" id="btn-excel-part">下載</button>
            </div>
        </div>

        <div class="report-right-section">
            <h3 class="time-title">選擇時間段</h3>
            <div class="date-inputs">
                <input type="text" class="date-picker-input" id="excel-start-time" placeholder="開始時間">
                <input type="text" class="date-picker-input" id="excel-end-time" placeholder="結束時間">
            </div>
        </div>

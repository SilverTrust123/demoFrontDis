    <main class="content-wrapper" style="flex-direction: column; position: relative;">
        
        <div class="top-indicators-row">
            <div class="utilization-wrapper">
                <div class="utilization-pill">目前利用率 : <span id="utilization-val">0%</span></div>
            </div>
            
            <div class="server-pressure-circle" id="pressure-circle">
                <div class="pressure-label">伺服器壓力</div>
                <div class="pressure-value" id="server-pressure-val">0</div>
            </div>

            <div class="process-time-wrapper">
                <div class="process-time-pill">最近處理時間 : <span id="process-time-val">0</span> 秒</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: row; justify-content: space-evenly; align-items: stretch; gap: 30px; width: 100%; flex: 1;">
            <div class="chart-section pie-section">
                <h2 class="chart-title">系統整體運轉指標</h2>
                <div class="pie-container">
                    <canvas id="statusPieChart"></canvas>
                </div>
            </div>

            <div class="chart-section gauge-section">
                <h2 class="chart-title">壓力負載指標</h2>
                <div class="gauge-container">
                    <div class="gauge-dial" id="gaugeDial">
                        <div class="gauge-progress" id="gaugeProgress"></div>
                    </div>
                    <div class="gauge-bar-wrapper">
                        <div class="gauge-rainbow-bar"></div>
                        <div class="gauge-needle" id="gaugeNeedle"></div>
                    </div>
                </div>
            </div>

    <main class="content-wrapper">

                        <img src="../picture/metalline.png" alt="金屬產線機台">
                    </div>
                </div>

                <div class="card-bottom-section">
                    <div class="stat-row">
                        <span class="stat-label" id="cycle-count-label">第 1 輪時間：</span>
                        <span class="stat-value" id="current-cycle-time">00:00</span>
                    </div>
                    
                    <div class="stat-row">
                        <span class="stat-label">正常作業時間：</span>
                        <span class="stat-value" id="standard-cycle-time">46.76s</span>
                    </div>
                    
                    <div class="stat-row">
                        <span class="stat-label">差距設定：</span>
                        <div class="tolerance-wrapper">
                            <input type="number" id="tolerance-input" class="tolerance-input" value="10" min="0" max="100">

            <!-- ===== 右側折線圖區域 ===== -->

                <a href="productsta.html" class="back-btn" title="返回">
                    <svg width="45" height="45" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 10C9 8.89543 9.89543 8 11 8H18C19.1046 8 20 8.89543 20 10V16" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 11L9 8L12 5" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>

                <div class="chart-container">
                    <canvas id="detailChart"></canvas>

<script>
    // --- 1. 權限與差距設定邏輯 ---
    const toleranceInput = document.getElementById('tolerance-input');
    const TOLERANCE_KEY = 'PLC_TIME_TOLERANCE';

    const savedTolerance = localStorage.getItem(TOLERANCE_KEY) || 10;
    toleranceInput.value = savedTolerance;

    function checkPermissionForTolerance() {
        const token = localStorage.getItem('admin_token'); 
        if (token) {
            toleranceInput.disabled = false;
        } else {
            toleranceInput.disabled = true;
        }
    }

    toleranceInput.addEventListener('change', (e) => {
        let val = parseFloat(e.target.value);
        if (val < 0) val = 0;
        localStorage.setItem(TOLERANCE_KEY, val);
    });

    checkPermissionForTolerance();
    setInterval(checkPermissionForTolerance, 1000);


    // --- 2. Chart.js 客製化插件 (畫出紅色垂直連接線) ---
    const gapLinePlugin = {
        id: 'gapLinePlugin',
        beforeDatasetsDraw(chart) {
            const { ctx, data } = chart;
            const metaActual = chart.getDatasetMeta(0); 
            const metaStd = chart.getDatasetMeta(1);    

            ctx.save();
            ctx.strokeStyle = '#ff4d4d'; 
            ctx.lineWidth = 1.5;

            metaActual.data.forEach((pointActual, index) => {
                const pointStd = metaStd.data[index];
                const actualValue = data.datasets[0].data[index];
                
                if (actualValue !== null && pointActual && pointStd) {
                    ctx.beginPath();
                    ctx.moveTo(pointActual.x, pointActual.y);
                    ctx.lineTo(pointStd.x, pointStd.y);
                    ctx.stroke();
                }
            });
            ctx.restore();
        }
    };
    Chart.register(gapLinePlugin);


    // --- 3. 圖表初始化與標準時間對照表 ---
    const ctx = document.getElementById('detailChart').getContext('2d');
    
    const standardTimesDict = {
        1: 7.14, 10: 5.68, 11: 2.27, 12: 1.82, 13: 5.64, 14: 2.36, 15: 1.17, 16: 0.81,
        17: 7.56, 18: 1.62, 19: 1.49, 20: 1.10, 21: 2.62, 22: 1.01, 23: 0.59, 24: 0.83
    };

    const stepIndexMap = {
        1: 0, 10: 1, 11: 2, 12: 3, 13: 4, 14: 5, 15: 6, 16: 7,
        17: 8, 18: 9, 19: 10, 20: 11, 21: 12, 22: 13, 23: 14, 24: 15
    };

    let actualTimesData = new Array(16).fill(null);

    const detailChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['S1', 'S10', 'S11', 'S12', 'S13', 'S14', 'S15', 'S16', 'S17', 'S18', 'S19', 'S20', 'S21', 'S22', 'S23', 'S24'],
            datasets: [
                {
                    label: '實際時間',
                    data: actualTimesData,
                    borderColor: '#333333',
                    backgroundColor: '#333333',
                    pointBackgroundColor: '#333333',
                    pointRadius: 5,
                    borderWidth: 2,
                    tension: 0, 
                    spanGaps: true 
                },
                {
                    label: '標準時間',
                    data: Object.values(standardTimesDict), 
                    borderColor: '#4ade80',
                    backgroundColor: '#4ade80',
                    pointBackgroundColor: '#4ade80',
                    pointRadius: 5,
                    borderWidth: 2,
                    tension: 0 
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: { top: 20, right: 30 }
            },
            scales: {
                y: { 
                    title: { display: true, text: '時間 (秒)', align: 'end', font: { size: 16, weight: 'bold' } }, 
                    min: 0,
                    grid: { color: '#e0e0e0' }
                },
                x: { 
                    title: { display: true, text: '步驟', align: 'end', font: { size: 16, weight: 'bold' } },
                    grid: { display: false }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: { mode: 'index', intersect: false }
            }
        }
    });


    // --- 4. API 抓取、嚴謹 S50 急停攔截與輪次計算 ---
    let currentStep = null;
    let stepStartTime = null;
    let cycleStartTime = null;
    let cycleCount = 1;
    let hasCompletedFullCycle = false; 
    let lastElapsedSeconds = "00:00"; // 記錄急停當下的秒數，讓它凍結
    const POLLING_INTERVAL = 200; 

    function updateLiveTimer() {
        if (cycleStartTime !== null && currentStep !== 50) {
            const now = performance.now();
            lastElapsedSeconds = ((now - cycleStartTime) / 1000).toFixed(2);
        }
        // 如果是 S50，畫面直接顯示最後凍結的秒數，不再往上加
        document.getElementById('current-cycle-time').innerText = `${lastElapsedSeconds}s`;
        requestAnimationFrame(updateLiveTimer);
    }
    requestAnimationFrame(updateLiveTimer);

    async function fetchPlcState() {
        try {
            const response = await fetch('http://192.168.3.85:9090/plc/state');
            if (!response.ok) throw new Error('網路回應錯誤');
            
            const resJson = await response.json();
            
            // ⚡ 嚴格解析 API 格式
            let rawState = resJson;
            if (resJson && typeof resJson === 'object') {
                rawState = resJson.state !== undefined ? resJson.state : (resJson.reply !== undefined ? resJson.reply : null);
            }
            const newStep = parseInt(rawState, 10);

            if (isNaN(newStep)) return;

            // ⚡ 如果當前狀態是 S50 (急停)，強制中斷計時與狀態推進
            if (newStep === 50) {
                currentStep = 50;
                document.getElementById('current-cycle-time').style.color = "#ff4d4d"; // 變成警告紅代表暫停
                return;
            } else {
                document.getElementById('current-cycle-time').style.color = "#00ff88"; // 恢復正常螢光綠
            }

            if (newStep !== currentStep) {
                const now = performance.now(); 

                // ===============================================
                // 1. 【先】結算上一個步驟 (currentStep) 的時間並寫入陣列
                // ===============================================
                if (currentStep !== null && currentStep !== 50 && stepStartTime !== null) {
                    const timeDiffSeconds = parseFloat(((now - stepStartTime) / 1000).toFixed(2));
                    
                    const dataIndex = stepIndexMap[currentStep];
                    if (dataIndex !== undefined) {
                        actualTimesData[dataIndex] = timeDiffSeconds;
                        detailChart.update();
                    }

                    const stdTime = standardTimesDict[currentStep];
                    if (stdTime) {
                        const tolerancePercent = parseFloat(localStorage.getItem(TOLERANCE_KEY) || 10);
                        const toleranceRatio = tolerancePercent / 100;
                        
                        const minAllowed = stdTime * (1 - toleranceRatio);
                        const maxAllowed = stdTime * (1 + toleranceRatio);

                        if (timeDiffSeconds < minAllowed || timeDiffSeconds > maxAllowed) {
                            if (typeof window.showError === 'function') {
                                window.showError(`警告：生產步驟 [S${currentStep}] 執行時間異常！\n標準時間: ${stdTime}秒\n實際時間: ${timeDiffSeconds}秒\n(差距設定範圍: ±${tolerancePercent}%)`);
                            }
                        }
                    }
                }

                // ===============================================
                // 2. 【後】判斷如果是回到 S1，就進行新輪次的清空作業
                // ===============================================
                if (newStep === 1) {
                    if (currentStep === 24) {
                        hasCompletedFullCycle = true;
                    }

                    if (hasCompletedFullCycle) {
                        cycleCount++;
                        document.getElementById('cycle-count-label').innerText = `第 ${cycleCount} 輪時間：`;
                        hasCompletedFullCycle = false; 
                    }
                    
                    cycleStartTime = now; 
                    actualTimesData.fill(null); // 💥 此時清空，剛剛寫入的 S24 就會被一併清得乾乾淨淨
                    detailChart.update();
                } else if (cycleStartTime === null) {
                    cycleStartTime = now;
                }

                // 3. 更新當前狀態，為下一步做準備
                currentStep = newStep;
                stepStartTime = now;
            }

        } catch (error) {
            console.error('獲取 PLC 狀態失敗:', error);
        }
    }

    setInterval(fetchPlcState, POLLING_INTERVAL);

</script>
